services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/app.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
      - app-logs:/app/logs
    restart: unless-stopped

volumes:
  app-data:
  app-uploads:
  app-logs:
